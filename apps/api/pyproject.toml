[project]
name = "yukar"
version = "0.1.0"
description = "Autonomous coding agent - local-only web app"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "ruamel.yaml>=0.18.6",
    "pathspec>=0.12.1",
    "strands-agents>=1.44.0",
    "faiss-cpu>=1.14.2",
    "tree-sitter>=0.25.2",
    "tree-sitter-language-pack>=1.8.1",
    "numpy>=2.0",
    "watchfiles>=0.21",
    "httpx>=0.28.1",
    # strands-agents[anthropic] declares anthropic<1.0; AnthropicModel is not
    # tested against the 1.x SDK, so stay within the range Strands supports.
    "anthropic>=0.105.2,<1",
    "playwright>=1.61.0",
    # Imported directly by agents/mcp_manager.py. strands-agents caps mcp below 2.2,
    # and only the newest release of each mcp line receives fixes, so stay on the
    # maintained 1.x line until strands accepts the current 2.x release.
    "mcp>=1.30.0,<2",
    "python-pptx>=1.0.2",
]

[project.scripts]
yukar = "yukar.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yukar"]

[tool.uv]
exclude-newer = "7 days"
# Security exception (GHSA-6q48-6c7w-9gw2, compromised eMudhra CAs): take the
# latest certifi immediately. Remove once the release-age window has passed.
exclude-newer-package = { certifi = false }
package = true

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "ty>=0.0.1a6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]
ignore = [
    "ANN401",  # Dynamically typed expressions (typing.Any) are disallowed
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN"]

[tool.ty.environment]
python-version = "3.14"
